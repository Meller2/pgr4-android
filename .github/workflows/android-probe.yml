name: Android ARM64 probe

on:
  push:
    paths:
      - 'android/probe/**'
      - '.github/workflows/android-probe.yml'
  pull_request:
    paths:
      - 'android/probe/**'
      - '.github/workflows/android-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Build native Vulkan probe
        run: |
          cmake -S android/probe -B out/android-probe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build out/android-probe --parallel 2
      - name: Verify the binary architecture
        run: readelf -h out/android-probe/pgr4-vulkan-probe | grep -F AArch64
