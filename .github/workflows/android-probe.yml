name: Android ARM64 probe

on:
  push:
    paths:
      - 'android/probe/**'
      - '.github/workflows/android-probe.yml'
  pull_request:
    paths:
      - 'android/probe/**'
      - '.github/workflows/android-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK
        run: |
          ndk="${ANDROID_HOME:-}/ndk/28.2.13676358"
          if [ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]; then
            archive="$RUNNER_TEMP/android-ndk-r28c-linux.zip"
            curl --fail --silent --show-error --location --retry 3 \
              https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$archive"
            echo "a7b54a5de87fecd125a17d54f73c446199e72a64  $archive" | sha1sum -c -
            unzip -q "$archive" -d "$RUNNER_TEMP"
            ndk="$RUNNER_TEMP/android-ndk-r28c"
          fi
          echo "PGR4_ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
      - name: Build native Vulkan probe
        run: |
          cmake -S android/probe -B out/android-probe -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PGR4_ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build out/android-probe --parallel 2
      - name: Verify the binary architecture
        run: readelf -h out/android-probe/pgr4-vulkan-probe | grep -F AArch64
