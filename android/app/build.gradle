plugins {
    id 'com.android.application'
}

def sdkPath = providers.environmentVariable('PGR4_REXSDK_DIR').orNull
if (!sdkPath) {
    throw new GradleException('Set PGR4_REXSDK_DIR to the Android-capable ReXGlue SDK source tree.')
}
def rexSdk = new File(sdkPath).canonicalFile
def sdlJava = new File(rexSdk, 'thirdparty/sdl3/android-project/app/src/main/java')
if (!new File(sdlJava, 'org/libsdl/app/SDLActivity.java').isFile()) {
    throw new GradleException('SDL3 sources are missing from the ReXGlue SDK tree.')
}

android {
    namespace 'dev.pgr4port.android'
    compileSdk 35
    ndkVersion '28.2.13676358'
    def customNdk = providers.environmentVariable('PGR4_ANDROID_NDK').orNull
    if (customNdk) {
        ndkPath customNdk
    }

    defaultConfig {
        applicationId 'dev.pgr4port.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.0.1-dev'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DREXSDK_DIR=${rexSdk.path.replace('\\', '/')}", '-DANDROID_STL=c++_shared'
                targets 'pgr4_recompiled', 'rexgpu-xenos', 'rex_android_gpu_driver',
                        'main_hook', 'hook_impl', 'file_redirect_hook', 'gsl_alloc_hook'
            }
        }
    }

    buildTypes {
        benchmark {
            initWith debug
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=Release'
                }
            }
        }
    }

    packaging {
        jniLibs {
            // AdrenoTools opens the hook libraries from a filesystem directory.
            useLegacyPackaging = true
        }
    }

    sourceSets.main.java.srcDir sdlJava
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.30.5'
        }
    }
}
